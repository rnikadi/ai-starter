name: ${COMPOSE_PROJECT_NAME:-ai-starter}

services:
  archestra:
    image: archestra/platform:1.4.0-rc.36@sha256:b673affbc4f6704ba181b815ab7ce8352397ee084702742d6ee93159551bac2f
    container_name: archestra
    restart: unless-stopped
    labels:
      logging: "promtail"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9000:9000"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - app-data:/app/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    restart: unless-stopped
    labels:
      logging: "promtail"
    command:
      - start-dev
      - --import-realm
    env_file:
      - .env.keycloak
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME: "http://localhost:8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/ai-starter-realm.json:ro

  # Full containerized application services (activated with profile: full)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-starter-backend
    restart: unless-stopped
    labels:
      logging: "promtail"
    profiles: ["full"]
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      BACKEND_PORT: "4000"
      HOST: "0.0.0.0"
      AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/ai-starter"
      AUTH_KEYCLOAK_INTERNAL_URL: "http://keycloak:8080/realms/ai-starter"
      ARCHESTRA_INTERNAL_URL: "http://archestra:9000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "json"
    depends_on:
      keycloak:
        condition: service_started
      archestra:
        condition: service_started
      loki:
        condition: service_healthy
      promtail:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-starter-frontend
    restart: unless-stopped
    labels:
      logging: "promtail"
    profiles: ["full"]
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: "http://backend:4000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000"
      AUTH_URL: "http://localhost:3001"
      AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/ai-starter"
      AUTH_KEYCLOAK_INTERNAL_URL: "http://keycloak:8080/realms/ai-starter"
      LOG_FORMAT: "json"
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_started

  # Observability Stack (activated with profile: monitoring or full)
  loki:
    image: grafana/loki:3.3.0
    container_name: ai-starter-loki
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  promtail:
    image: grafana/promtail:3.3.0
    container_name: ai-starter-promtail
    user: "0:0"
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-starter-prometheus
    restart: unless-stopped
    labels:
      logging: "promtail"
    profiles: ["full", "monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-starter-grafana
    restart: unless-stopped
    labels:
      logging: "promtail"
    profiles: ["full", "monitoring"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3002"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/application-logs.json"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-postgres-data
  app-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-app-data
  keycloak-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-keycloak-data
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-loki-data
  prometheus-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-prometheus-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-grafana-data
