name: ${COMPOSE_PROJECT_NAME:-ai-starter}

services:
  archestra:
    image: archestra/platform:1.4.0-rc.36@sha256:b673affbc4f6704ba181b815ab7ce8352397ee084702742d6ee93159551bac2f
    container_name: archestra
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9000:9000"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - app-data:/app/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    env_file:
      - .env.keycloak
    environment:
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/ai-starter-realm.json:ro

  # Full containerized application services (activated with profile: full)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-starter-backend
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      BACKEND_PORT: "4000"
      HOST: "0.0.0.0"
      AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/ai-starter"
      ARCHESTRA_BASE_URL: "http://archestra:9000/v1"
      ARCHESTRA_VIRTUAL_KEY: "${ARCHESTRA_VIRTUAL_KEY:-}"
      ARCHESTRA_MODEL: "${ARCHESTRA_MODEL:-}"
      MOCK_AI: "${MOCK_AI:-false}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "json"
    depends_on:
      - keycloak
      - archestra

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai-starter-frontend
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: "http://backend:4000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000"
      AUTH_URL: "http://localhost:3001"
      AUTH_SECRET: "${AUTH_SECRET:-local-development-secret-key-32chars}"
      AUTH_KEYCLOAK_ID: "${AUTH_KEYCLOAK_ID:-ai-starter-web}"
      AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/ai-starter"
      AUTH_KEYCLOAK_SECRET: "${AUTH_KEYCLOAK_SECRET:-ai-starter-kit-local-client-secret}"
      LOG_FORMAT: "json"
    depends_on:
      - backend
      - keycloak

  # Observability Stack (activated with profile: monitoring or full)
  loki:
    image: grafana/loki:3.3.0
    container_name: ai-starter-loki
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.0
    container_name: ai-starter-promtail
    user: "0:0"
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.4.0
    container_name: ai-starter-grafana
    restart: unless-stopped
    profiles: ["full", "monitoring"]
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3002"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-postgres-data
  app-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-app-data
  keycloak-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-keycloak-data
  loki-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-loki-data
  grafana-data:
    name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}-grafana-data
