name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification suite (test, typecheck, lint, build)
        run: pnpm check
        env:
          AUTH_SECRET: "ci-dummy-secret-minimum-32-characters-long"
          AUTH_URL: "http://localhost:3001"
          AUTH_KEYCLOAK_ID: "ai-starter-web"
          AUTH_KEYCLOAK_SECRET: "ci-dummy-keycloak-secret"
          AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/ai-starter"
          BACKEND_URL: "http://localhost:4000"
          ARCHESTRA_BASE_URL: "http://localhost:9000/v1/openrouter"
          ARCHESTRA_VIRTUAL_KEY: "ci-dummy-virtual-key"
          ARCHESTRA_MODEL: "ci-dummy-model"
          FRONTEND_URL: "http://localhost:3001"
          DATABASE_URL: "postgresql://aistarter:secret@localhost:5432/aistarter_db"
