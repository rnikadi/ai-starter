server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      # 1. Clean container name (strip leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # 2. Extract compose service name if available
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # 3. If service is empty, fallback to container name
      - source_labels: ['service', 'container']
        regex: ';(.*)'
        replacement: '$1'
        target_label: 'service'

      # 4. Mirror to service_name for Grafana Explore / Logs Drilldown compatibility
      - source_labels: ['service']
        target_label: 'service_name'

      # 5. Extract stdout / stderr stream
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

    pipeline_stages:
      # Parse structured JSON logs when produced by backend/frontend
      - json:
          expressions:
            level: level
            reqId: reqId
            msg: msg
            time: time
            statusCode: statusCode
      - labels:
          level:
          reqId:

  - job_name: host-applications
    static_configs:
      - targets:
          - localhost
        labels:
          job: host-applications
          logging: promtail
          __path__: /var/log/host-apps/*.log
    relabel_configs:
      # Exclude dev.log to avoid duplicating entries already in backend.log / frontend.log
      - source_labels: ['__path__']
        regex: '.*/dev\.log'
        action: drop
      # Extract service name from filename (backend.log -> backend, frontend.log -> frontend)
      - source_labels: ['__path__']
        regex: '.*/([^/]+)\.log'
        target_label: 'service'
      - source_labels: ['service']
        target_label: 'service_name'
      - source_labels: ['service']
        target_label: 'container'
    pipeline_stages:
      # 1. Parse structured JSON logs if present
      - json:
          expressions:
            level: level
            reqId: reqId
            msg: msg
            time: time
            statusCode: statusCode
      # 2. Extract log level from plain text format [INFO], [WARN], [ERROR], [DEBUG]
      - regex:
          expression: '\[(?P<level_text>DEBUG|INFO|WARN|ERROR)\]'
      - template:
          source: level
          template: '{{ if .level }}{{ .level }}{{ else if .level_text }}{{ ToLower .level_text }}{{ else }}info{{ end }}'
      - labels:
          level:
          reqId:
