server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576

scrape_configs:
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Extract container name without leading slash
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"

      # Extract compose service name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"

      # Extract compose project name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"

      # Only scrape containers from our ai-starter project or without project label
      - source_labels: ["project"]
        regex: "ai-starter.*"
        action: keep

    pipeline_stages:
      # Parse JSON log lines if formatted as JSON (e.g. backend / frontend logger)
      - json:
          expressions:
            level: level
            reqId: reqId
            msg: msg
            time: time
            statusCode: statusCode
      - labels:
          level:
          reqId:

